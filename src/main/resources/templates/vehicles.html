<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>All Vehicles</title>
</head>
<body>
<h1>All Vehicles</h1>

<a href="/">Home</a> |
<a href="/vehicles/add">Add Vehicle</a> |
<a href="/vehicles/search">Search Vehicle</a> |
<a href="/vehicles/summary">Vehicle Summary</a>
<br><br>

<table border="1">
    <tr>
        <th>Vehicle Number</th>
        <th>Owner Name</th>
        <th>Color</th>
        <th>Type</th>
        <th>Action</th>
    </tr>

    <tr th:each="v : ${vehicles}">
        <td th:text="${v.vehicleNumber}"></td>
        <td th:text="${v.ownerName}"></td>
        <td th:text="${v.color}"></td>
        <td th:text="${v.type}"></td>
        <td>
            <a th:href="@{/vehicles/edit(vehicleNumber=${v.vehicleNumber})}">Edit</a>
            |
            <a th:href="@{/vehicles/delete(vehicleNumber=${v.vehicleNumber})}"
               onclick="return confirm('Are you sure you want to delete this vehicle?')">
                Delete
            </a>
        </td>
    </tr>
</table>
</body>
</html>
