<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Vehicle</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <h1>Add Vehicle</h1>

    <form id="vehicleForm">
        <label>Vehicle Type</label><br>
        <select id="type">
            <option value="">Select vehicle type</option>
            <option value="Car">Car</option>
            <option value="Bike">Bike</option>
            <option value="Van">Van</option>
            <option value="Bus">Bus</option>
            <option value="Lorry">Lorry</option>
            <option value="ThreeWheeler">ThreeWheeler</option>
            <option value="SUV">SUV</option>
        </select><br><br>

        <label>Vehicle Number</label><br>
        <input type="text" id="vehicleNumber" placeholder="Enter vehicle number"><br><br>

        <label>Owner Name</label><br>
        <input type="text" id="ownerName" placeholder="Enter owner name"><br><br>

        <label>Color</label><br>
        <input type="text" id="color" placeholder="Enter color"><br><br>

        <button type="submit">Add Vehicle</button>
    </form>

    <p id="message"></p>

    <br>
    <a href="index.html">Back to Home</a>
</div>

<script src="script.js"></script>
</body>
</html>
