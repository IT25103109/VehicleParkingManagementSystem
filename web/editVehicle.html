<!DOCTYPE html>
<html>
<head>
    <title>Edit Vehicle</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <h1>Edit Vehicle</h1>

    <form id="editVehicleForm">
        <label>Vehicle Type</label><br>
        <input type="text" id="editType" placeholder="Enter vehicle type"><br><br>

        <label>Vehicle Number</label><br>
        <input type="text" id="editVehicleNumber" placeholder="Enter vehicle number"><br><br>

        <label>Owner Name</label><br>
        <input type="text" id="editOwnerName" placeholder="Enter owner name"><br><br>

        <label>Color</label><br>
        <input type="text" id="editColor" placeholder="Enter color"><br><br>

        <button type="submit">Update Vehicle</button>
    </form>

    <p id="editMessage"></p>

    <br>
    <a href="viewVehicles.html">Back to Vehicles</a>
</div>

<script src="script.js"></script>
</body>
</html>
