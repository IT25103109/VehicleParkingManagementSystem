<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Vehicle</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <h1>Search Vehicle</h1>
    <p class="subtitle">Find a saved vehicle by number</p>

    <form id="searchForm">
        <div class="form-group">
            <label for="searchNumber">Vehicle Number</label>
            <input type="text" id="searchNumber" placeholder="Enter vehicle number">
        </div>

        <button type="submit">Search</button>
    </form>

    <div class="result-box">
        <h3 class="result-title">Search Result</h3>
        <p id="searchResult">Vehicle details will appear here.</p>
    </div>

    <a class="back-link" href="index.html">← Back to Home</a>
</div>

<script src="script.js"></script>
</body>
</html>
